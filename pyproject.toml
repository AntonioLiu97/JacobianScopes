[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "JacobianScopes"
version = "0.1.0"
description = "Fisher, Temperature, and Semantic Scopes for LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "tqdm",
    "matplotlib",
    # plotter_utils imports IPython.display; needed for `import JacobianScopes` everywhere
    "ipython>=8",
]

[project.optional-dependencies]
# Everything needed to run the demo notebooks in this repo (kernel + UI).
notebooks = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["JacobianScopes*"]
